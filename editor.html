<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 自动剪辑</title>
<style>
:root{color-scheme:dark;font:16px/1.55 "Microsoft YaHei UI",sans-serif;background:#101217;color:#f1f3f5}
*{box-sizing:border-box}body{margin:0}main{max-width:850px;padding:44px 22px;margin:auto}
h1{font-size:clamp(32px,6vw,50px);line-height:1.1;margin:0 0 10px}h2{font-size:19px;margin:0 0 14px}p{margin:0 0 12px;color:#bdc5ce}
section,aside{background:#1b1f26;border:1px solid #333b47;border-radius:15px;padding:20px;margin-top:16px}
aside{border-color:#866128;background:#2b2319}button,select,input::file-selector-button,.button{border:1px solid #515e6f;border-radius:8px;padding:9px 12px;font:inherit;background:#282f3a;color:#fff}
button,.button,input::file-selector-button{cursor:pointer}button:disabled{cursor:default;opacity:.5}.button{text-decoration:none;display:inline-block}
.primary{background:#ffcb59;color:#221700;border-color:#ffcb59;font-weight:bold}
label{display:grid;gap:6px}.choices{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}select{min-width:0;width:100%}
a{color:#ffd47a}output{display:block;color:#d9e3ef;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px}[hidden]{display:none!important}
@media(max-width:650px){.choices{grid-template-columns:1fr}main{padding:26px 12px}}
#drop{position:relative;justify-items:center;padding:24px;border:2px dashed #677381;border-radius:9px;cursor:pointer}
#drop.on,#drop:focus-within{border-color:#ffcb59;background:#30291e}#drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}#drop span{color:#bdc5ce}
.counter-options{display:flex;flex-wrap:wrap;align-items:flex-end;gap:20px;margin-bottom:16px}.check{display:flex;align-items:center;padding-bottom:8px;gap:7px}
.advanced-bar{border-top:1px solid #38414b;margin-top:16px;padding-top:14px}.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:bold}.switch input{width:19px;height:19px;accent-color:#ffcb59}
#advancedPanel{margin:14px 0 0;border:0;padding:0}.advanced-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px 16px;margin:12px 0}
.advanced-grid input[type=range]{width:100%;accent-color:#ffcb59}.advanced-grid label span{color:#bfc8d3;font-size:13px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.compare figure{margin:0;min-width:0}
.compare figcaption{display:flex;justify-content:space-between;gap:8px;font-weight:bold;margin-bottom:5px}.compare small{font-weight:400;color:#b8c2cf}
.viewport{background:#101419;display:grid;place-items:center;height:clamp(140px,18vw,200px);overflow:hidden;border:1px solid #414b58;border-radius:6px}
.viewport canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto}#changes{touch-action:none;cursor:crosshair}
#advancedPanel p{font-size:13px;margin:8px 0;color:#b7c2ce}#advancedPanel h3{font-size:16px;margin:16px 0 6px}
@media(max-width:640px){.compare{grid-template-columns:1fr}.viewport{height:185px}}
.highlight-options{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px}.highlight-options label{display:flex;align-items:center;gap:5px} #roundRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-top:12px}
</style>
<main>
<header><h1>CS2 自动剪辑</h1><p>选一个 Demo，生成带击杀计数的选手视角合集。</p></header>

<section>
<h2>1. 选择比赛 Demo</h2>
<label id="drop"><strong>把 .dem 文件拖到这里</strong><span>或点击选择比赛文件</span>
<input id="file" aria-label="选择比赛 Demo" type="file" accept=".dem"></label>
<output id="source" aria-live="polite"></output>
</section>
<section>
<h2>2. 选择选手和剪辑内容</h2>
<div class="choices">
<label>选手<select id="player" disabled></select></label>
<label>剪辑模式<select id="mode"></select></label>
<label>枪械<select id="weapon"></select></label>
</div>
<button id="roundMode" type="button" aria-pressed="false" style="margin-top:12px">单回合特剪</button>
<div id="highlightRow" hidden><div class="highlight-options" id="highlightTypes" role="group" aria-label="高光类型"></div></div>
<div id="roundRow" hidden>
<label>高光回合<select id="round"></select></label>
</div>
<output id="preview" aria-live="polite"></output>
</section>
<section>
<h2>3. 导出视频</h2>
<div class="counter-options">
<label>转场样式<select id="transition"><option value="original">原版</option><option value="broadcast">赛事导播 · 斜向扫屏</option></select></label>
<label>画面统计<select id="counter"><option>仅击杀</option><option>击杀-死亡</option><option>不显示</option></select></label>
<label class="check"><input type="checkbox" id="showLabel" checked>显示 KILLS 字样</label>
</div>
<div class="advanced-bar"><label class="switch"><input id="advancedOn" type="checkbox" aria-controls="advancedPanel" autocomplete="off">高级设置</label></div>
<fieldset id="advancedPanel" hidden disabled aria-label="高级录制设置">
<h3>画面与视角</h3>
<div class="advanced-grid">
<label>画面比例<select id="ratio"></select></label>
<label>录制分辨率<select id="size"></select></label>
<label>录制帧率<select id="fps"><option>24</option><option>30</option><option>60</option></select></label>
<label>编码画质<select id="crf"><option value="23">节省空间 · CRF 23</option><option value="18" selected>清晰 · CRF 18</option><option value="16">高清晰 · CRF 16</option></select></label>
<label>观察视角<select id="camera"><option value="eyes">选手第一人称</option><option value="chase">第三人称跟随</option></select></label>
<label>持枪视野 <span>viewmodel_fov · <b id="fovValue"></b></span><input id="fov" type="range" min="54" max="68" value="60"></label>
</div>
<h3>雷达与战绩</h3>
<div class="advanced-grid">
<label>雷达面板大小 <span>cl_hud_radar_scale · <b id="radarValue"></b></span><input id="radar" type="range" min=".8" max="1.3" step=".05" value="1"></label>
<label>雷达地图缩放 <span>cl_radar_scale · <b id="zoomValue"></b></span><input id="zoom" type="range" min=".25" max="1" step=".05" value=".7"></label>
<label>战绩字号 <span id="fontSizeValue"></span><input type="range" id="fontSize" min="16" max="72" value="32"></label>
<label>战绩位置<select id="position"><option value="radar">跟随小地图下方</option><option value="custom">自定义位置</option></select></label>
<label>水平位置 <span id="xValue"></span><input type="range" id="x" min="0" max="100" step=".1" value="1"></label>
<label>垂直位置 <span id="yValue"></span><input type="range" id="y" min="0" max="94" step=".1" value="41"></label>
</div>
<div class="compare">
<figure><figcaption>基准示意 <small>1280 × 720</small></figcaption><div class="viewport"><canvas id="baseline" aria-label="第一人称基准画面"></canvas></div></figure>
<figure><figcaption>当前设置 <small id="currentSize"></small></figcaption><div class="viewport"><canvas id="changes" aria-label="当前设置示意，可拖动定位战绩"></canvas></div></figure>
</div>
<p>可在右侧参考图上点击或拖动来定位战绩。第一人称参考图使用 Inferno 实录画面，第三人称为构图示意；游戏内的光影、清晰度和帧率以导出视频为准。</p>
</fieldset>
<button class="primary" id="export" style="margin-top:14px" disabled>自动导出 MP4</button>
<a class="button" id="download" href="./download" hidden>下载成片</a>
<output id="status" aria-live="polite"></output>
</section>
</main>
<script src="./advanced.js"></script>
<script>
const $ = id => document.getElementById(id);
const fill = (id, values) => $(id).replaceChildren(...values.map(value => new Option(id === 'player' ? value.replace(/ \[.*\]$/, '') : value, value)));
let ready = false, busy = false, clips = 0, previewVersion = 0;
function controls() {
  advancedControls(busy);
  $('export').disabled = !ready || busy || !clips;
  $('file').disabled = busy;
  $('player').disabled = busy || !$('player').options.length;
  $('mode').disabled = busy;
  const roundMode = $('mode').value === '单回合特剪';
  $('roundMode').disabled = busy || !$('mode').options.length;
  $('roundMode').classList.toggle('primary', roundMode);
  $('roundMode').setAttribute('aria-pressed', String(roundMode));
  $('highlightRow').hidden = !['高光','单回合特剪'].includes($('mode').value);
  $('roundRow').hidden = $('mode').value !== '单回合特剪';
  $('transition').disabled = busy;
  $('round').disabled = busy || !$('round').options.length;
  $('highlightTypes').querySelectorAll('input').forEach(input => input.disabled = busy);
  $('counter').disabled = busy;
  $('showLabel').disabled = busy || $('counter').value === '不显示';
  $('weapon').disabled = busy || $('mode').value === '全部死亡';
}
async function request(route, body) {
  const response = await fetch('./' + route, body === undefined ? {} : {method:'POST', body});
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || '请求失败');
  return data;
}
async function sync() {
  const data = await request('status');
  ready = data.ready;
  busy = data.busy;
  if (!ready) data.message ||= '内置录制组件缺失，请使用完整的工具目录。';
  $('download').hidden = !data.download;
  $('status').textContent = data.message;
  controls();
  return data;
}
$('counter').onchange = controls;
const params = () => JSON.stringify({
  player: $('player').value, mode: $('mode').value, weapon: $('weapon').value,
  highlights: Array.from($('highlightTypes').querySelectorAll('input:checked'), input => input.value),
  transition: $('transition').value,
  round: $('round').value === '' ? null : Number($('round').value),
  advanced: advancedPayload(), counter: $('counter').value, showLabel: $('showLabel').checked,
});
async function preview() {
  const version = ++previewVersion;
  clips = 0;
  controls();
  if (!$('player').value) {
    $('preview').textContent = $('mode').value === '单回合特剪' ? '导入 Demo 并选择选手后，即可选择高光回合。' : '';
    return;
  }
  try {
    const data = await request('preview', params());
    if (version !== previewVersion) return;
    const previousRound = $('round').value;
    $('round').replaceChildren(...data.rounds.map(round => new Option('第 ' + (Number(round) + 1) + ' 回合', round)));
    if (data.rounds.some(round => String(round) === previousRound)) $('round').value = previousRound;
    clips = data.clips;
    $('preview').textContent = clips
      ? `${data.events} 条匹配事件，合并后 ${clips} 个片段。`
      : '这组条件没有匹配片段，可调整高光类型或枪械。';
  } catch (error) {
    if (version === previewVersion) $('preview').textContent = error.message;
  }
  controls();
}
async function loadFile(file) {
  if (!file || busy) return;
  if (!file.name.toLowerCase().endsWith('.dem')) {
    $('source').textContent = '请选择 .dem 格式的比赛文件。';
    return;
  }
  busy = true;
  clips = 0;
  controls();
  $('source').textContent = '正在读取并解析 Demo…';
  try {
    const data = await request('demo', file);
    fill('player', data.players);
    $('source').textContent = `${file.name} · ${data.players.length} 名选手`;
    await sync();
    await preview();
  } catch (error) {
    $('source').textContent = error.message;
    busy = false;
    await preview();
  }
};
$('file').onchange = () => loadFile($('file').files[0]);
document.addEventListener('dragover', event => event.preventDefault());
document.addEventListener('drop', event => event.preventDefault());
$('drop').ondragover = event => { event.preventDefault(); $('drop').classList.add('on'); };
$('drop').ondragleave = () => $('drop').classList.remove('on');
$('drop').ondrop = event => {
  event.preventDefault();
  $('drop').classList.remove('on');
  if (event.dataTransfer.files.length === 1) loadFile(event.dataTransfer.files[0]);
  else $('source').textContent = '请每次拖入一场比赛。';
};
$('roundMode').onclick = () => {
  $('mode').value = $('mode').value === '单回合特剪' ? '高光' : '单回合特剪';
  preview();
};
$('highlightTypes').onchange = preview;
['player','mode','weapon','round'].forEach(id => $(id).onchange = preview);

$('export').onclick = async () => {
  busy = true;
  controls();
  $('download').hidden = true;
  try {
    const data = await request('export', params());
    $('status').textContent = data.message;
    await waitForExport();
    if (!$('download').hidden) $('download').click();
  } catch (error) {
    busy = false;
    $('status').textContent = error.message;
    controls();
  }
};
async function waitForExport() {
  while (busy) {
    await new Promise(resolve => setTimeout(resolve, 1000));
    await sync();
  }
}
sync().then(async data => {
  initAdvanced(data.sizes);
  for (const [value, name] of Object.entries(data.highlights)) {
    const label = document.createElement('label');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.value = value;
    box.checked = true;
    label.append(box, name);
    $('highlightTypes').append(label);
  }
  fill('mode', data.modes);
  fill('weapon', data.weapons);
  fill('player', data.players);
  if (busy) await waitForExport();
  return preview();
}).catch(error => $('status').textContent = error.message);
</script>
</html>
